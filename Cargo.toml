[package]
name = "rust-actix-seaorm"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-service = "2.0.3"
actix-web = "4.14.1"
actix-web-httpauth = "0.8.2"
argon2 = "0.5.3"
async-trait = "0.1.89"
chrono = { version = "0.4.43", features = ["serde"] }
dotenv = "0.15.0"
env_logger = "0.11.9"
futures = "0.3.31"
jsonwebtoken = "10.3.0"
log = "0.4.29"
once_cell = "1.21.3"
password-hash = "0.5.0"
rand_core = { version = "0.10.1" }
redis = { version = "1.0.3", features = ["tokio-comp", "connection-manager"] }
regex = "1.12.3"
sea-orm = { version = "1.1.19", features = [
  "sqlx-postgres",
  "runtime-tokio-native-tls",
  "macros",
] }
sea-orm-migration = "1.1.19"
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }
